{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    {% comment %} <link rel="stylesheet" href="{% static 'css/output.css' %}" /> {% endcomment %}
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body class="bg-gray-100">
    <div class="w-1/2 mx-auto mt-8 ">
        <div>
            {% if messages %}
              {% for message in messages %}
                  <div class="px-2 py-1 {% if message.tags == 'success' %} bg-green-500{% endif%}"> {{message}} </div>
              {% endfor %}
                
            {% endif %}
        </div>
        <form method="POST">
            {% csrf_token %}
            {{ task_form.as_p}}
            {{ task_detail_form.as_p}}
            <button type="submit" class="bg-rose-600 mb-4 mt-2 px-3 py-3 rounded-md text-white">Submit</button>
        </form>
    </div>
  </body>
</html>
