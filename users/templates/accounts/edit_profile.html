{% extends 'base.html' %}

{% block content %}


      <div class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
        <div class="flex min-h-screen">
          <!-- Sidebar -->
          <aside class="w-72 bg-white/80 backdrop-blur-lg shadow-lg">
            <div class="p-6">
              <h2 class="text-2xl font-bold text-indigo-800 animate-fade-in">Menu</h2>
            </div>
            <nav class="mt-6 space-y-2 px-4">
              <a href="{% url 'profile' %}" 
                class="block py-3 px-6 text-gray-700 hover:bg-indigo-100 rounded-lg transition-all duration-300"
                >Profile</a>
              <a href="{% url 'edit_profile' %}"
                class="block py-3 px-6 text-indigo-700 bg-indigo-100 rounded-lg shadow-sm hover:bg-indigo-200 transition-all duration-300 font-semibold"
                >Edit Profile</a>
              <a href="{% url 'change_password' %}"
                class="block py-3 px-6 text-gray-700 hover:bg-indigo-100 rounded-lg transition-all duration-300"
                >Change Password</a>
            </nav>
          </aside>

          <!-- Main Content -->
          <main class="flex-1 p-8 animate-fade-in">
            <h1 class="text-4xl font-bold text-indigo-900 mb-8 relative">
              Edit Profile
              <span class="absolute bottom-0 left-0 w-20 h-1 bg-indigo-500 rounded-full"></span>
            </h1>

            <div class="bg-white/80 backdrop-blur-lg shadow-xl rounded-2xl p-8 max-w-3xl mx-auto">
              <form method="POST" enctype="multipart/form-data" class="space-y-6">
                {% csrf_token %}
                
                <!-- Profile Picture -->
                <div class="mb-8">
                  <label class="block text-indigo-800 font-semibold mb-4">Profile Picture</label>
                  <div class="flex items-center space-x-6">
                    <div class="relative group w-32 h-32">
                      <img
                        src="{{ user.profile_picture.url|default:'https://png.pngtree.com/png-clipart/20231019/original/pngtree-user-profile-avatar-png-image_13369988.png' }}"
                        alt="Current Profile Picture"
                        class="w-full h-full rounded-full object-cover border-4 border-indigo-200"
                      />
                      <div class="absolute inset-0 rounded-full bg-indigo-500 opacity-0 group-hover:opacity-20 transition-opacity duration-300"></div>
                    </div>
                    <input type="file" name="profile_picture" class="block w-full text-sm text-slate-500
                      file:mr-4 file:py-2 file:px-4
                      file:rounded-full file:border-0
                      file:text-sm file:font-semibold
                      file:bg-indigo-50 file:text-indigo-700
                      hover:file:bg-indigo-100
                      transition-all duration-300"
                    />
                  </div>
                </div>

                <!-- Personal Information -->
                <div class="bg-white/50 rounded-xl p-6 shadow-md hover-scale space-y-4">
                  <h3 class="text-xl font-bold text-indigo-800 mb-4 flex items-center">
                    <svg class="w-6 h-6 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                    Personal Information
                  </h3>
                  
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                      <input type="text" name="name" value="{{ user.name }}"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition-all duration-300"
                      />
                    </div>
                    <div>
                      <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                      <input type="email" name="email" value="{{ user.email }}"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition-all duration-300"
                      />
                    </div>
                    <div>
                      <label class="block text-sm font-medium text-gray-700 mb-1">Location</label>
                      <input type="text" name="location" value="{{ user.location }}"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition-all duration-300"
                      />
                    </div>
                    <div>
                      <label class="block text-sm font-medium text-gray-700 mb-1">Role/Position</label>
                      <input type="text" name="role" value="{{ user.role }}"
                        class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition-all duration-300"
                      />
                    </div>
                  </div>
                </div>

                <!-- Bio -->
                <div class="bg-white/50 rounded-xl p-6 shadow-md hover-scale">
                  <h3 class="text-xl font-bold text-indigo-800 mb-4 flex items-center">
                    <svg class="w-6 h-6 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
                    </svg>
                    Bio
                  </h3>
                  <textarea name="bio" rows="4"
                    class="w-full px-4 py-2 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400 transition-all duration-300"
                  >{{ user.bio }}</textarea>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-end">
                  <button type="submit"
                    class="bg-indigo-600 text-white px-8 py-3 rounded-lg font-semibold hover:bg-indigo-700 transform hover:-translate-y-0.5 transition-all duration-300"
                  >
                    Save Changes
                  </button>
                </div>
              </form>
            </div>
          </main>
        </div>
      </div>


  {% endblock content %}
